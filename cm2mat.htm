  <link rel="stylesheet" href="responsive.css">
  <style>
    body { background: #f5f7ff; }
    .hero {
      background: #1a7a60;
      color: #fff;
      padding: 20px 16px 18px;
      text-align: center;
    }
    .hero h1 { margin: 0; font-size: 1.7rem; color: #fff !important; }
    .main { max-width: 680px; margin: 0 auto; padding: 20px 16px 48px; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: #1a7a60; color: #fff !important; padding: 10px 20px;
      border-radius: 50px; font-size: 1rem !important; font-weight: 700;
      margin-bottom: 20px; text-decoration: none !important;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }
    .section { background: #fff; border-radius: 14px; margin-bottom: 16px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,80,.09); }
    .sec-title {
      background: #1a7a6018; color: #1a7a60;
      font-size: 1.05rem; font-weight: 800; padding: 12px 16px;
      border-bottom: 2px solid #1a7a6030;
    }
    .sec-links { padding: 8px; display: flex; flex-direction: column; gap: 2px; }
    .link-btn {
      display: block; padding: 14px 12px; border-radius: 8px;
      color: #1a1a2e !important; font-size: 1.05rem !important;
      text-decoration: none !important; font-weight: 500;
      transition: background .15s; touch-action: manipulation;
    }
    .link-btn::before { content: "▶ "; font-size: .7em; color: #1a7a60; }
    .link-btn:hover, .link-btn:active { background: #1a7a6012; color: #1a7a60 !important; }
    @media (max-width: 480px) {
      .link-btn { padding: 16px 12px; font-size: 1.1rem !important; }
    }
  </style>
